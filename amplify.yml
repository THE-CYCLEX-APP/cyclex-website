version: 1
backend:
  phases:
    build:
      commands:
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo "Static site, nothing to build"
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - 'assets/**/*'
  cache:
    paths:
      - .npm/**/*
